<!DOCTYPE html>
<html>

<head>
    <link rel="icon" type="image/x-icon" href="/favicon_io/favicon.ico">
    <script type="text/javascript" src="./main.js"></script>
    <style type="text/css">
        body {
            background: #1d1d1d;
            color: #d8d8d8;
        }

        table#canvas td {
            width: 40px;
            height: 40px;
            border: 1px #4b4b4b solid;
        }

        table#canvas td:hover {
            cursor: pointer;
            border-color: #CCC;
        }

        #colorHistory {
            max-width: 600px;
            overflow: hidden;
        }

        .historyColor {
            width: 30px;
            height: 30px;
            display: inline-block;
        }
    </style>
</head>

<body>

    <h1>Draw</h1>

    <h2>Pick a color</h2>
    <input type="color" id="colorpicker" />

    <h3>Used colors</h3>
    <div id="colorHistory">
    </div>

    <br />
    <table id="canvas" cellspacing="0" cellpadding="0"></table>

    <br /><br />
    <input type="button" id="clear" value="Clear" />
    <input type="button" id="re-fetch" value="Re-fetch" />

</body>

</html>
